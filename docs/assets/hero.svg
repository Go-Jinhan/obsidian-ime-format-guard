<title id="banner-title">IME Format Guard for Obsidian</title>
<desc id="banner-desc">보라색 배경과 공식 옵시디언 마크. 한글 입력이 끝난 다음, 굵게와 기울임을 적용하는 독립 커뮤니티 플러그인.</desc>
