  <radialGradient id="banner-glow"><stop stop-color="#dfc7ff" stop-opacity=".44"/><stop offset="1" stop-color="#cab0ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="banner-line" x1="765" x2="1230" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="banner-clip"><rect width="1280" height="440" rx="24"/></clipPath>
</defs>
